# Only ecosystems present in this repository: GitHub Actions. The mods have no
# package dependencies, and mise tool pins are bumped deliberately with `mise lock --bump`.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Los_Angeles"
    commit-message:
      prefix: "ci"
      include: "scope"
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "github-actions"
    assignees:
      - "SimplicityGuy"
    groups:
      actions-version-updates:
        applies-to: version-updates
        patterns: ["*"]
      actions-security-updates:
        applies-to: security-updates
        patterns: ["*"]
